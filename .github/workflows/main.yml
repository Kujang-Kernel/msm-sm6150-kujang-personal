
name: Reforging

on:
  workflow_dispatch:

jobs:
  Reforging:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        build_type: [KSU-AOSP, KSU-OEM, Non-KSU]

    steps:

      # ==========================================
      # CHECKOUT SOURCE
      # ==========================================
      - name: 🔄 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ==========================================
      # PREPARE ENVIRONMENT
      # ==========================================
      - name: ⏰ Prepare Environment
        shell: bash
        run: |
          set -euo pipefail

          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

          sudo apt update -y

          sudo apt install -y \
            bc cpio flex bison git python-is-python3 \
            tar aria2 perl wget curl lz4 libssl-dev \
            libxml2 patch zip build-essential \
            libncurses-dev libelf-dev

          mkdir -p clang
          cd clang

          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz

          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz

          cd ..

          git clone --depth=1 -b main \
            https://github.com/greenforce-project/gcc-arm64 gcc64

          git clone --depth=1 -b main \
            https://github.com/greenforce-project/gcc-arm gcc32

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"

          echo "BUILD_DATE=\"$(TZ=Asia/Jakarta date '+%b %d %Y')\"" >> "$GITHUB_ENV"

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

      # ==========================================
      # NOMOUNT
      # ==========================================
      - name: 🥷 Setup NoMount
        shell: bash
        run: |
          set -euo pipefail

          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/master/kernel/setup.sh | bash -s master

      # ==========================================
      # KERNELSU
      # ==========================================
      - name: 📥 Setup KernelSU
        if: matrix.build_type == 'KSU-AOSP' || matrix.build_type == 'KSU-OEM'
        shell: bash
        run: |
          set -euo pipefail

          curl -LSs https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh | bash -s main

          test -d KernelSU

          echo "KernelSU installed successfully."

      # ==========================================
      # OEM SETUP
      # ==========================================
      - name: 🧰 OEM Setup
        if: matrix.build_type == 'KSU-OEM'
        shell: bash
        run: |
          set -euo pipefail

          DTS=arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi

          test -f "$DTS"

          sed -i \
            -e 's/qcom,mdss-pan-physical-width-dimension = <69>;/qcom,mdss-pan-physical-width-dimension = <695>;/' \
            -e 's/qcom,mdss-pan-physical-height-dimension = <154>;/qcom,mdss-pan-physical-height-dimension = <1546>;/' \
            "$DTS"

      # ==========================================
      # BUILD STOCK KERNEL
      # ==========================================
      - name: 🛠️ Build Kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export KBUILD_BUILD_USER=Manipulator
          export KBUILD_BUILD_HOST=ExoticGANK
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"
          export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"

          echo "=================================="
          echo " BUILD: ${{ matrix.build_type }}"
          echo "=================================="

          make O=out ARCH=arm64 vendor/sweet_defconfig

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_PATH/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-eabi-"

          test -f out/arch/arm64/boot/Image.gz
          test -f out/arch/arm64/boot/dtb.img
          test -f out/arch/arm64/boot/dtbo.img

          cp out/.config out/sweet_defconfig.txt

          echo "Stock kernel build completed."

      # ==========================================
      # UPLOAD CONFIG
      # ==========================================
      - name: 💾 Upload Config
        uses: actions/upload-artifact@v7
        with:
          name: configs-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
          path: out/sweet_defconfig.txt
          if-no-files-found: error

      # ==========================================
      # BUILD 90HZ DTBO
      # ==========================================
      - name: 📦 Build 90Hz DTBO
        shell: bash
        run: |
          set -euo pipefail

          PATCH="arch/arm64/boot/dts/qcom/90hz-dtbo.patch"

          test -f "$PATCH"

          echo "=================================="
          echo " BACKUP STOCK DTB / DTBO"
          echo "=================================="

          cp out/arch/arm64/boot/dtb.img "$RUNNER_TEMP/dtb-stock.img"
          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-stock.img"

          echo "=================================="
          echo " APPLY 90HZ PATCH"
          echo "=================================="

          git apply --check "$PATCH"
          git apply "$PATCH"

          APPLIED=1

          cleanup() {
            if [ "$APPLIED" = "1" ]; then
              git apply -R "$PATCH"
            fi
          }

          trap cleanup EXIT

          echo "=================================="
          echo " REBUILD 90HZ DTBO"
          echo "=================================="

          rm -rf out/arch/arm64/boot/dts
          rm -f out/arch/arm64/boot/dtb.img
          rm -f out/arch/arm64/boot/dtbo.img

          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"

          export KBUILD_BUILD_USER=Manipulator
          export KBUILD_BUILD_HOST=ExoticGANK
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"
          export CFLAGS_EXTRA="-DBUILD_DATE=$BUILD_DATE"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_PATH/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-eabi-"

          test -f out/arch/arm64/boot/dtbo.img

          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/dtbo-90hz.img"

          echo "=================================="
          echo " RESTORE STOCK DTB / DTBO"
          echo "=================================="

          cp "$RUNNER_TEMP/dtb-stock.img" out/arch/arm64/boot/dtb.img
          cp "$RUNNER_TEMP/dtbo-stock.img" out/arch/arm64/boot/dtbo.img

          git apply -R "$PATCH"
          APPLIED=0

          trap - EXIT

          echo "90Hz DTBO build completed."

      # ==========================================
      # PREPARE ANYKERNEL3
      # ==========================================
      - name: 📂 Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 -b strix \
            https://github.com/manipvlator/Anykernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cp out/arch/arm64/boot/dtb.img AnyKernel3/

          cp "$RUNNER_TEMP/dtbo-90hz.img" \
            AnyKernel3/dtbo-90hz.img

          ZIP_NAME="StriXotic-Limited_${{ matrix.build_type }}-${{ github.ref_name }}-${BUILD_TIME}.zip"

          (
            cd AnyKernel3
            zip -r "../$ZIP_NAME" . -x ".git/*"
          )

          test -f "$ZIP_NAME"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "AnyKernel3 package completed."

      # ==========================================
      # UPLOAD FLASHABLE ZIP
      # ==========================================
      - name: 📤 Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: StriXotic-Limited_${{ matrix.build_type }}-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
