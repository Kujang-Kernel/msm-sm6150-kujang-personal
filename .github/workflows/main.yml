name: Kujang-Beta

on:
  workflow_dispatch:

jobs:
  Reforging:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [KSU-AOSP, KSU-OEM, Non-KSU]

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⏰ Prepare Environment
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          sudo apt update -y
          sudo apt install -y bc cpio flex bison git python-is-python3 tar aria2 perl wget curl lz4 libssl-dev libxml2 zip unzip patch

          mkdir -p clang && cd clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz

          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm64 "$GITHUB_WORKSPACE/gcc64"
          git clone --depth=1 -b main https://github.com/greenforce-project/gcc-arm "$GITHUB_WORKSPACE/gcc32"

          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%d%m%Y-%H%M')" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> "$GITHUB_ENV"
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> "$GITHUB_ENV"
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> "$GITHUB_ENV"

      - name: 📥 Setup KernelSU + NoMount + SUSFS (Terbaru)
        if: matrix.build_type == 'KSU-AOSP' || matrix.build_type == 'KSU-OEM'
        run: |
          curl -LSs https://raw.githubusercontent.com/manipvlator/KernelSU/refs/heads/main/kernel/setup.sh | bash -s main
          curl -LSs https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.14 susfs
          
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true

          cd KernelSU
          patch -p1 < ../susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ..

          patch -p1 < susfs/kernel_patches/50_add_susfs_in_kernel.patch || true

      - name: ⚙️ Inject Defconfig Addons (SUSFS & Fast Charge)
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/sweet_defconfig"
          
          if [ "${{ matrix.build_type }}" != "Non-KSU" ]; then
            echo "" >> "$DEFCONFIG"
            echo "# SUSFS Configurations" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> "$DEFCONFIG"
          fi

          echo "" >> "$DEFCONFIG"
          echo "# Power & Charger Configurations" >> "$DEFCONFIG"
          echo "CONFIG_QPNP_SMB5=y" >> "$DEFCONFIG"
          echo "CONFIG_FORCE_FAST_CHARGE=y" >> "$DEFCONFIG"

      - name: 🧰 OEM Setup
        if: matrix.build_type == 'KSU-OEM'
        run: |
          DTS=arch/arm64/boot/dts/qcom/dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi
          sed -i \
            -e 's/qcom,mdss-pan-physical-width-dimension = <69>;/qcom,mdss-pan-physical-width-dimension = <695>;/' \
            -e 's/qcom,mdss-pan-physical-height-dimension = <154>;/qcom,mdss-pan-physical-height-dimension = <1546>;/' \
            "$DTS"

      - name: 🛠️ Build Kernel
        run: |
          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
          export KBUILD_BUILD_USER=Manipulator
          export KBUILD_BUILD_HOST=ExoticGANK
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"
          export CFLAGS_EXTRA="-DBUILD_DATE=$(date +%s)"

          make O=out ARCH=arm64 vendor/sweet_defconfig
          make -j"$(nproc --all)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64_PATH/bin/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32_PATH/bin/arm-eabi-" \
            LOCALVERSION=-Kujang-Personal \
            KCFLAGS="-Wno-error=unused-variable -Wno-error=unused-function"

          cp out/.config out/sweet_defconfig.txt

      - name: 💾 Upload Config
        uses: actions/upload-artifact@v7
        with:
          name: configs-${{ matrix.build_type }}-${{ env.BUILD_TIME }}
          path: out/sweet_defconfig.txt

      - name: 📂 Prepare AnyKernel3 & Packaging
        run: |
          git clone --depth=1 -b strix https://github.com/manipvlator/Anykernel3.git AnyKernel3
          cp out/arch/arm64/boot/{Image.gz,dtbo.img,dtb.img} AnyKernel3/
          ZIP_NAME="Kujang-Personal_${{ matrix.build_type }}-${{ github.ref_name }}-${BUILD_TIME}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          (cd AnyKernel3 && zip -r9 "../$ZIP_NAME" . -x ".git/*")

      - name: 📤 Upload Flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: Kujang-Personal_${{ matrix.build_type }}-${{ github.ref_name }}-${{ env.BUILD_TIME }}
          path: ${{ env.ZIP_NAME }}
